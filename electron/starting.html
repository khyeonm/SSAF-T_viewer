<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SSAF-T Viewer</title>
<style>
  /* shown while the viewer server starts: the page's own colours and the panel's wordmark */
  html, body { margin: 0; height: 100%; background: #0e1014; color: #e6e9ef;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .word { font-size: 28px; font-weight: 800; letter-spacing: -.06em; }
  .word span { font-weight: 600; letter-spacing: -.02em; color: #98a1b1; }
  .msg { margin-top: 14px; color: #98a1b1; }
  .bar { width: 180px; height: 3px; margin: 16px auto 0; background: #2a303b; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #6aa8ff; border-radius: 2px;
    animation: go 1.2s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
  <div class="box">
    <div class="word">SSAF-T <span>Viewer</span></div>
    <div class="msg">Starting… the first launch takes a little longer.</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
