# The build environment of the app, one per platform (macOS, Windows, Linux):
#   micromamba create -f environment.yml      (or: conda env create -f environment.yml)
#   micromamba activate ssaft-app
# It holds the viewer server's Python packages (server/app.py imports them), PyInstaller to freeze the
# server, and Node to run Electron and electron-builder.
name: ssaft-app
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  # OpenBLAS, not MKL: conda-forge links numpy/scipy to MKL on Windows, ~500 MB of DLLs in the installed app.
  # The server's work (ndimage filters, sorting, small coordinate transforms) does not depend on BLAS: the
  # same builds ran equally fast with identical outputs under both.
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - zarr>=3
  - numcodecs
  - pyarrow
  - tifffile
  - shapely
  - geopandas-base
  - pyproj
  - pillow
  - pyinstaller
  - nodejs=22
